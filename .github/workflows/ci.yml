name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      perl-version:
        description: Perl version to build (defaults to versions.json)
        type: string
        required: false

permissions:
  contents: read

# A full run is all Perl builds with their test suites, so a new push to a
# pull request cancels the run it supersedes. Pushes to main are left to
# finish, so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the change needs the lint and build jobs at all. This is a
  # job rather than `paths-ignore` on the triggers because the required
  # "CI Success" check must report on every pull request: a workflow that
  # never starts leaves the check pending and the PR unmergeable.
  changes:
    name: changed files
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request)
              git fetch -q origin "${BASE_REF}"
              range="$(git merge-base "origin/${BASE_REF}" HEAD)..HEAD" ;;
            push)
              range="${BEFORE}..${AFTER}" ;;
            *)
              # Manual runs always build.
              echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # Changes confined to documentation and the licence need no build.
          # If the range cannot be resolved (first push of a branch), build.
          if ! changed="$(git diff --name-only "${range}" 2>/dev/null)"; then
            changed="(unknown)"
          fi
          printf '%s\n' "${changed}"
          # (no `grep -q`: with pipefail its early exit can SIGPIPE the producer)
          if [ -n "$(printf '%s\n' "${changed}" | grep -vE '(^|/)[^/]+\.md$|^LICENSE$' || true)" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed; skipping lint and build."
          fi

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # -x so the sourced build/common.sh is followed.
          shellcheck -x build/*.sh

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem build/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "FAIL - $($_.Name)"
              $errors | ForEach-Object { Write-Host "   $_" }
              $failed = $true
            } else {
              Write-Host "ok   - $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Check the smoke test compiles
        run: perl -c test/smoke.pl

      - name: Check versions.json
        run: |
          python3 - <<'PY'
          import json, re
          v = json.load(open("versions.json"))
          assert v["default"] in v["perl"], "default is not listed under perl"
          specs = dict(v["perl"], cpanm=v["cpanm"])
          for name, spec in specs.items():
              assert re.fullmatch(r"[0-9a-f]{64}", spec["sha256"]), \
                  f"{name}: sha256 is not 64 lowercase hex chars"
              assert spec["url"].startswith("https://"), f"{name}: url is not https"
          assert len(set(v["platforms"])) == len(v["platforms"]), "duplicate platform"
          # catch drift between the release.yml and build.yml
          matrix = open(".github/workflows/build.yml").read()
          for p in v["platforms"]:
              assert re.search(r"- platform: %s$" % re.escape(p), matrix, re.M), \
                  f"{p} is listed in versions.json but missing from build.yml's matrix"
          print(f"{len(v['platforms'])} platforms, default perl {v['default']}")
          PY

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml
    with:
      perl-version: ${{ inputs.perl-version || '' }}

  # The single check for branch protection to require: it depends on every
  # other job and fails unless each succeeded. A failed dependency does not do
  # that by itself. Without `if: always()` this job would be *skipped*, and
  # branch protection treats a skipped required check as passed; with it, the
  # job runs and reports success whatever it needed. Hence the explicit check.
  # A skipped lint or build is accepted only when `changes` decided the change
  # needed no build.
  success:
    name: CI Success
    if: always()
    needs: [changes, lint, build]
    runs-on: ubuntu-26.04
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Fail unless every job succeeded (or was skipped on purpose)
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: |
          echo "${NEEDS}"
          exit 1

      # GitHub has no "needs: all"; a job added without being listed above
      # would not gate merges. Make that a failure here instead.
      - uses: actions/checkout@v7
      - name: Fail if a job is missing from `needs` above
        run: |
          diff <(sed -n '/^jobs:/,$p' .github/workflows/ci.yml | grep -oE '^  [A-Za-z0-9_-]+:$' | tr -d ' :' | grep -vx success | sort) \
               <(jq -r 'keys[]' <<< "${NEEDS}" | sort)
